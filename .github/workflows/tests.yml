name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai-agents>=0.6,<1" "qdrant-client>=1.9,<2"
      - name: Agent tests (offline)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Web tests (offline)
        run: python -m unittest discover -s web_app/tests -p "test_*.py" -v
